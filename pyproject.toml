[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argotech"
version = "0.2.0"
description = "AgroTech agronomic risk and crop health inference service"
requires-python = ">=3.11"

# Pinned to the versions the .pkl models were trained with. Unpinned, the image picked up
# scikit-learn 1.9.0 / numpy 2.4.6 and joblib.load died with "ModuleNotFoundError: No module named
# '_loss'" — a pickle carries references to the exact internal module layout of the scikit-learn
# that wrote it. Retrain and bump both together, never one alone. The medium-term fix is to stop
# shipping pickles at all: see docs/model-design.md, "artifact format".
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "psycopg2-binary",
  "requests",
  "pandas",
  "scikit-learn==1.6.1",
  "numpy==2.0.2",
  "joblib==1.5.3",
  "xgboost==2.1.4",
  "mlflow",
  "opentelemetry-sdk==1.41.1",
  "opentelemetry-exporter-otlp-proto-http==1.41.1",
  "opentelemetry-instrumentation-fastapi==0.62b1",
]

[project.optional-dependencies]
# Training-only. `shap` was imported by the training scripts but absent from requirements.txt, so a
# clean venv could not run them.
train = ["shap", "matplotlib", "pyarrow"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
